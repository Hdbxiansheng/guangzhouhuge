<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租车方案管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23117A50'/%3E%3Cpath d='M7 15l1-4 1.5-3h5l1.5 3 1 4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans SC",-apple-system,sans-serif;background:#F2F5F2;color:#1B2A22;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #E4EAE5;border-radius:14px;padding:16px;margin-bottom:16px}
  /* login */
  .login{max-width:360px;margin:60px auto;background:#fff;border:1px solid #E4EAE5;border-radius:16px;padding:24px}
  .login h1{font-size:20px;margin-bottom:16px;text-align:center}
  .login label{display:block;font-size:13px;margin:10px 0 4px;color:#5B6B62}
  .login input{width:100%;padding:11px;border:1px solid #E4EAE5;border-radius:9px;font-size:15px}
  .login button{width:100%;margin-top:16px;padding:12px;background:#117A50;color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700}
  .msg{color:#C0392B;font-size:13px;margin-top:10px;text-align:center}
  /* header */
  .hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .hdr .t{font-weight:900;font-size:20px;margin-right:auto}
  .tab{padding:8px 14px;border:1px solid #E4EAE5;border-radius:999px;background:#fff;font-size:14px}
  .tab.on{background:#117A50;color:#fff;border-color:#117A50}
  .logout{color:#C0392B}
  /* form */
  .row{display:grid;gap:10px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{font-size:13px;color:#5B6B62}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid #E4EAE5;border-radius:8px;font-size:14px;font-family:inherit}
  .carBox{border:1px solid #E4EAE5;border-radius:10px;padding:12px;margin-top:12px}
  .carBox .mt{font-weight:700;font-size:14px;margin-bottom:8px}
  .plans .planrow{display:grid;grid-template-columns:56px 1fr 1fr 80px 1fr auto;gap:6px;align-items:center;margin-top:6px}
  .mini{font-size:11px;color:#8a5a10;background:#FBF1DE;border-radius:6px;padding:3px 6px;margin-left:6px}
  .btn{padding:8px 12px;border-radius:8px;border:1px solid #E4EAE5;background:#fff;font-size:14px}
  .btn.prim{background:#117A50;color:#fff;border-color:#117A50}
  .btn.danger{color:#C0392B}
  .btn.ghost{color:#5B6B62}
  /* list */
  .sch{border:1px solid #E4EAE5;border-radius:10px;padding:12px;margin-bottom:10px}
  .sch .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sch .hd .nm{font-weight:900;font-size:16px}
  .sch .hd .tag{font-size:11px;background:#FDEED9;color:#8a5a10;padding:2px 8px;border-radius:999px;font-weight:700}
  .sch .hd .ops{margin-left:auto;display:flex;gap:6px}
  .sch .models{color:#5B6B62;font-size:13px;margin-top:6px}
  .lead{border:1px solid #E4EAE5;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .empty{color:#8a9490;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView" class="login">
    <h1>租车方案管理后台</h1>
    <label>账号</label><input id="acc" value="13611472233">
    <label>密码</label><input id="pwd" type="password" value="111111">
    <button id="loginBtn">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="appView" style="display:none">
    <div class="hdr">
      <div class="t">方案管理后台</div>
      <button class="tab on" data-tab="input">录入方案</button>
      <button class="tab" data-tab="list">方案管理</button>
      <button class="tab" data-tab="leads">客户留资</button>
      <button class="tab logout" id="logoutBtn">退出</button>
    </div>

    <!-- 录入 -->
    <div id="tab-input">
      <div class="card">
        <div class="f2" style="margin-bottom:10px">
          <div><label>车源方/公司</label><input id="cCompany" placeholder="如：广州老马"></div>
          <div><label>更新日期/版本</label><input id="cDate" placeholder="如：2026-10-25 或 10.8更新"></div>
        </div>
        <label>方案所属月份（用于月度提醒）</label><input id="cMonth" placeholder="如：2026-10" style="max-width:220px">
        <label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" id="cRec" style="width:auto">设为推荐（客户入口置顶）</label>
      </div>
      <div class="card">
        <label>粘贴方案文本（可快速解析填入表单，支持一汽/老马/祺宸这类格式）</label>
        <textarea id="paste" rows="7" placeholder="例如：&#10;[爱心]26年红旗500&#10;押金4000（不后补）&#10;7期：3900&#10;12期：3800&#10;……"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn prim" id="parseBtn">解析到表单</button>
          <button class="btn ghost" id="clearBtn">清空表单</button>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span style="font-weight:700">车型列表</span><button class="btn" id="addCarBtn">+ 添加车型</button></div>
        <div id="carEditor"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn prim" id="saveBtn" style="flex:1;padding:12px;font-size:15px">保存方案</button>
        </div>
        <div class="msg" id="saveMsg"></div>
      </div>
    </div>

    <!-- 管理 -->
    <div id="tab-list" style="display:none">
      <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="listSearch" placeholder="搜索公司/车型" style="flex:1;min-width:200px">
        <button class="btn" id="refreshBtn">刷新</button>
      </div></div>
      <div id="schemesList"></div>
    </div>

    <!-- 留资 -->
    <div id="tab-leads" style="display:none">
      <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="leadSearch" placeholder="搜索手机号/微信号/车型" style="flex:1;min-width:200px">
        <button class="btn" id="leadRefresh">刷新</button>
      </div>
      <div id="leadsList"></div>
    </div>
  </div>
</div>

<script>
var TOKEN = localStorage.getItem('admtok') || '';
function api(path, opt){ opt = opt||{}; opt.headers = opt.headers||{}; if(TOKEN) opt.headers['Authorization']='Bearer '+TOKEN; if(opt.body && typeof opt.body!=='string'){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(opt.body);} return fetch(path, opt).then(function(r){ if(!r.ok) return r.json().then(function(e){ throw new Error(e.error||('请求失败 '+r.status)); }); return r.json(); }); }

var state = { tab:'input', cars: [], editingId:null };

function switchTab(t){
  state.tab=t;
  ['input','list','leads'].forEach(function(x){ var el=document.getElementById('tab-'+x); el.style.display=(x===t?'block':'none'); });
  document.querySelectorAll('.tab[data-tab]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab')===t); });
  if(t==='list') loadSchemes();
  if(t==='leads') loadLeads();
}

// 车型编辑表单
function planRowHTML(cIdx, pIdx, p){
  return '<div class="planrow">'
    +'<input data-c="'+cIdx+'" data-p="'+pIdx+'" data-f="periods" value="'+(p.periods||'')+'" placeholder="期数">'
    +'<input data-c="'+cIdx+'" data-p="'+pIdx+'" data-f="monthlyRent" value="'+(p.monthlyRent||'')+'" placeholder="月租">'
    +'<input data-c="'+cIdx+'" data-p="'+pIdx+'" data-f="effectiveRent" value="'+(p.effectiveRent||'')+'" placeholder="优惠后月租">'
    +'<input data-c="'+cIdx+'" data-p="'+pIdx+'" data-f="giftDays" value="'+(p.giftDays||'')+'" placeholder="送天数">'
    +'<input data-c="'+cIdx+'" data-p="'+pIdx+'" data-f="otherBenefits" value="'+(p.otherBenefits||'')+'" placeholder="优惠/备注">'
    +'<button class="btn danger" data-delplan="'+cIdx+':'+pIdx+'">×</button></div>';
}
function renderCarEditor(){
  var el=document.getElementById('carEditor'); var h='';
  state.cars.forEach(function(c,ci){
    h+='<div class="carBox"><div class="mt">车型 '+(ci+1)+' <button class="btn danger" data-delcar="'+ci+'" style="float:right">删除</button></div>'
      +'<div class="f2"><div><label>车型</label><input data-c="'+ci+'" data-f="model" value="'+(c.model||'')+'" placeholder="如：全新26年启辰VX6 续航510"></div>'
      +'<div><label>押金</label><input data-c="'+ci+'" data-f="deposit" value="'+(c.deposit||'')+'" placeholder="如：3000"></div></div>'
      +'<label style="margin-top:6px">押金备注</label><input data-c="'+ci+'" data-f="depNote" value="'+(c.depNote||'')+'" placeholder="如：线上2000后补500+500">'
      +'<div class="plans" style="margin-top:8px"><label>分期方案</label>'
      +(c.plans||[]).map(function(p,pi){return planRowHTML(ci,pi,p);}).join('')
      +'</div>'
      +'<button class="btn ghost" data-addplan="'+ci+'" style="margin-top:6px">+ 添加期数</button>'
      +'</div>';
  });
  el.innerHTML=h || '<div class="empty">还没有车型，点上方"添加车型"或先粘贴文本解析</div>';
}
function updateCarFromInput(e){
  var t=e.target, c=t.getAttribute('data-c'), f=t.getAttribute('data-f');
  if(c==null)return; c=+c; var car=state.cars[c]; if(!car)return;
  if(f){ car[f]=t.value; return; }
  var p=t.getAttribute('data-p'); if(p==null)return; p=+p;
  var fld=t.getAttribute('data-f'); var pl=car.plans||(car.plans=[]); if(!pl[p])pl[p]={}; pl[p][fld]=t.value;
}

function parsePaste(){
  var text=document.getElementById('paste').value;
  var lines=text.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var cars=[]; var cur=null;
  lines.forEach(function(l){
    var depM=l.match(/押金\s*[:：]?\s*(\d+)/);
    var planM=l.match(/(\d+)\s*期\s*[:：]\s*(\d+)(?:\s*送\s*(\d+)\s*天)?(?:.*?优惠后\s*(\d+))?/);
    var modelM=l.match(/(全新|准新|次新|全新26年|26年|25年|续航)/);
    if(depM){
      cur={model:cur&&cur.model||'',deposit:depM[1],depNote:'',plans:[]}; cars.push(cur); return;
    }
    if(planM && !l.match(/奖励/)){
      if(!cur){cur={model:'',deposit:'',depNote:'',plans:[]};cars.push(cur);}
      cur.plans.push({periods:planM[1],monthlyRent:planM[2],effectiveRent:planM[4]||'',giftDays:planM[3]||'',otherBenefits:''});
      return;
    }
    if(cur && l.indexOf('押金')<0 && l.indexOf('期')<0 && l.indexOf('奖励')<0 && l.length<40 && !cur.model){
      cur.model=l; return;
    }
  });
  if(cars.length) { state.cars=cars; renderCarEditor(); document.getElementById('saveMsg').textContent='已解析 '+cars.length+' 款车型，请核对后保存'; }
  else document.getElementById('saveMsg').textContent='未能解析出车型，请用左侧表单手动填写';
}

function buildScheme(){
  var scheme={ company:document.getElementById('cCompany').value.trim(), updateDate:document.getElementById('cDate').value.trim(), monthTag:document.getElementById('cMonth').value.trim(), isRecommended:document.getElementById('cRec').checked, carList:[] };
  if(!scheme.company) throw new Error('请填写车源方/公司名称');
  state.cars.forEach(function(c){
    var car={model:c.model||'',deposit:Number(c.deposit)||0,depNote:c.depNote||'',installmentPlans:(c.plans||[]).map(function(p){return {periods:Number(p.periods)||0,monthlyRent:Number(p.monthlyRent)||0,effectiveRent:Number(p.effectiveRent)||0,giftDays:Number(p.giftDays)||0,otherBenefits:p.otherBenefits||''};}).filter(function(p){return p.periods||p.monthlyRent;})};
    if(car.model||car.deposit) scheme.carList.push(car);
  });
  if(!scheme.carList.length) throw new Error('至少添加一款车型');
  return scheme;
}
function saveScheme(){
  try{
    var scheme=buildScheme();
    var url = state.editingId ? ('/api/schemes/'+state.editingId) : '/api/schemes';
    var method = state.editingId ? 'PUT' : 'POST';
    api(url,{method:method,body:scheme}).then(function(){ document.getElementById('saveMsg').textContent='保存成功'; resetForm(); switchTab('list'); }).catch(function(e){ document.getElementById('saveMsg').textContent=e.message; });
  }catch(e){ document.getElementById('saveMsg').textContent=e.message; }
}
function resetForm(){ state.cars=[]; state.editingId=null; document.getElementById('cCompany').value='';document.getElementById('cDate').value='';document.getElementById('cMonth').value='';document.getElementById('cRec').checked=false;document.getElementById('paste').value='';renderCarEditor(); }

function loadSchemes(){
  var k=(document.getElementById('listSearch').value||'').trim().toLowerCase();
  api('/api/schemes').then(function(list){
    var el=document.getElementById('schemesList');
    if(!list.length){el.innerHTML='<div class="empty">还没有方案</div>';return;}
    el.innerHTML=list.filter(function(s){return !k||(s.company+' '+(s.carList||[]).map(function(c){return c.model;}).join(' ')).toLowerCase().indexOf(k)>=0;}).map(function(s){
      var models=(s.carList||[]).map(function(c){return c.model;}).join('、');
      return '<div class="sch"><div class="hd"><span class="nm">'+(s.company||'未知公司')+'</span>'+(s.isRecommended?'<span class="tag">推荐</span>':'')+'<span style="color:#8a9490;font-size:12px">'+(s.updateDate||'')+'</span>'
        +'<span class="ops"><button class="btn" data-edit="'+s.id+'">编辑</button><button class="btn" data-rec="'+s.id+'">'+(s.isRecommended?'取消推荐':'设为推荐')+'</button><button class="btn danger" data-del="'+s.id+'">删除</button></span></div>'
        +'<div class="models">'+models+'</div></div>';
    }).join('')||'<div class="empty">无匹配方案</div>';
  }).catch(function(e){document.getElementById('schemesList').innerHTML='<div class="empty">'+e.message+'</div>';});
}
function editScheme(id){
  api('/api/schemes/'+id).then(function(s){
    state.editingId=id; state.cars=(s.carList||[]).map(function(c){return {model:c.model,deposit:c.deposit,depNote:c.depNote||'',plans:(c.installmentPlans||[]).map(function(p){return {periods:p.periods,monthlyRent:p.monthlyRent,effectiveRent:p.effectiveRent,giftDays:p.giftDays,otherBenefits:p.otherBenefits};})};});
    document.getElementById('cCompany').value=s.company||'';document.getElementById('cDate').value=s.updateDate||'';document.getElementById('cMonth').value=s.monthTag||'';document.getElementById('cRec').checked=!!s.isRecommended;
    switchTab('input'); renderCarEditor();
  }).catch(function(e){alert(e.message);});
}

function loadLeads(){
  var k=(document.getElementById('leadSearch').value||'').trim().toLowerCase();
  api('/api/leads').then(function(list){
    var el=document.getElementById('leadsList');
    if(!list.length){el.innerHTML='<div class="empty">还没有客户留资</div>';return;}
    var st={pending:'待跟进',contacted:'已联系',won:'已成交'};
    el.innerHTML=list.filter(function(l){return !k||(l.phone+' '+l.wechat+' '+l.name+' '+l.schemeName).toLowerCase().indexOf(k)>=0;}).map(function(l){
      return '<div class="lead"><div><b>'+l.name+'</b> '+l.phone+(l.wechat?' / 微信 '+l.wechat:'')+'<br><span style="color:#8a9490;font-size:12px">关注：'+(l.schemeName||'-')+' · '+new Date(l.createdAt).toLocaleString('zh-CN')+'</span></div>'
        +'<div style="display:flex;gap:6px;align-items:center"><select data-lstatus="'+l.id+'"><option value="pending"'+(l.status==='pending'?' selected':'')+'>待跟进</option><option value="contacted"'+(l.status==='contacted'?' selected':'')+'>已联系</option><option value="won"'+(l.status==='won'?' selected':'')+'>已成交</option></select>'
        +'<button class="btn danger" data-ldel="'+l.id+'">删除</button></div></div>';
    }).join('')||'<div class="empty">无匹配留资</div>';
  }).catch(function(e){document.getElementById('leadsList').innerHTML='<div class="empty">'+e.message+'</div>';});
}

// ---- events ----
document.getElementById('loginBtn').addEventListener('click',function(){
  var acc=document.getElementById('acc').value.trim(), pwd=document.getElementById('pwd').value;
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:acc,password:pwd})}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});}).then(function(res){
    if(!res.ok){document.getElementById('loginMsg').textContent=res.d.error||'登录失败';return;}
    TOKEN=res.d.token; localStorage.setItem('admtok',TOKEN);
    document.getElementById('loginView').style.display='none'; document.getElementById('appView').style.display='block'; switchTab('input');
  }).catch(function(){document.getElementById('loginMsg').textContent='网络错误';});
});
document.getElementById('logoutBtn').addEventListener('click',function(){TOKEN='';localStorage.removeItem('admtok');document.getElementById('appView').style.display='none';document.getElementById('loginView').style.display='block';});
document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.addEventListener('click',function(){switchTab(b.getAttribute('data-tab'));});});

document.getElementById('addCarBtn').addEventListener('click',function(){state.cars.push({model:'',deposit:'',depNote:'',plans:[]});renderCarEditor();});
document.getElementById('clearBtn').addEventListener('click',function(){state.cars=[];document.getElementById('paste').value='';renderCarEditor();document.getElementById('saveMsg').textContent='';});
document.getElementById('parseBtn').addEventListener('click',parsePaste);
document.getElementById('saveBtn').addEventListener('click',saveScheme);
document.getElementById('carEditor').addEventListener('input',updateCarFromInput);
document.getElementById('carEditor').addEventListener('click',function(e){
  var delc=e.target.getAttribute('data-delcar'); if(delc!=null){state.cars.splice(+delc,1);renderCarEditor();return;}
  var delp=e.target.getAttribute('data-delplan'); if(delp!=null){var a=delp.split(':');var c=state.cars[+a[0]];if(c){c.plans.splice(+a[1],1);renderCarEditor();}return;}
  var addp=e.target.getAttribute('data-addplan'); if(addp!=null){var cc=state.cars[+addp];if(cc){cc.plans=cc.plans||[];cc.plans.push({periods:'',monthlyRent:'',effectiveRent:'',giftDays:'',otherBenefits:''});renderCarEditor();}return;}
});
document.getElementById('schemesList').addEventListener('click',function(e){
  var b=e.target.getAttribute('data-del'); if(b){ if(confirm('确定删除该方案？'))api('/api/schemes/'+b,{method:'DELETE'}).then(loadSchemes); return;}
  var r=e.target.getAttribute('data-rec'); if(r){api('/api/schemes/'+r+'/toggle-recommend',{method:'POST'}).then(loadSchemes);return;}
  var ed=e.target.getAttribute('data-edit'); if(ed){editScheme(ed);return;}
});
document.getElementById('listSearch').addEventListener('input',loadSchemes);
document.getElementById('refreshBtn').addEventListener('click',loadSchemes);
document.getElementById('leadSearch').addEventListener('input',loadLeads);
document.getElementById('leadRefresh').addEventListener('click',loadLeads);
document.getElementById('leadsList').addEventListener('click',function(e){
  var d=e.target.getAttribute('data-ldel'); if(d){if(confirm('删除该留资？'))api('/api/leads/'+d,{method:'DELETE'}).then(loadLeads);return;}
});
document.getElementById('leadsList').addEventListener('change',function(e){
  var sel=e.target.getAttribute('data-lstatus'); if(sel){api('/api/leads/'+sel,{method:'PUT',body:{status:e.target.value}}).catch(function(){});}
});

// 自动登录
if(TOKEN){
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:'13611472233',password:'111111'})}).then(function(r){return r.json();}).then(function(d){if(d.token){TOKEN=d.token;localStorage.setItem('admtok',TOKEN);document.getElementById('loginView').style.display='none';document.getElementById('appView').style.display='block';switchTab('input');}}).catch(function(){});
}
</script>
</body>
</html>
